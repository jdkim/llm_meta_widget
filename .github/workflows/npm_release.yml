name: Release Package on npm

# The same v* tag releases both artefacts: gem_release.yml publishes the gem,
# this publishes @aibranch/llm-meta-widget. One tag, two registries — which is
# the only way the two versions stay in step (see
# docs/custom-element-distribution.md, "Publishing to npm").
on:
  push:
    tags:
      - v*
  workflow_dispatch:

jobs:
  release:
    name: Publish to npm
    # GitHub-hosted only: npm's trusted publishing does not support
    # self-hosted runners.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The OIDC token npm verifies against the Trusted Publisher configured on
      # the package. Without this the publish falls back to looking for a token
      # and fails.
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Deliberately NO registry-url. With it, setup-node writes
      # _authToken=${NODE_AUTH_TOKEN} into a step .npmrc and exports the literal
      # placeholder NODE_AUTH_TOKEN=XXXXX-XXXXX-XXXXX-XXXXX when no token is
      # supplied. npm then sends that garbage credential instead of performing the
      # OIDC exchange, and the registry answers E404 "could not be found or you do
      # not have permission" — which reads like a missing package, not an auth
      # failure. Trusted publishing wants no credential configured at all.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Trusted publishing requires Node >= 22.14.0.
          node-version: "22"

      # Node 22 bundles npm 10.x, but trusted publishing needs >= 11.5.1.
      # Without this the publish fails with an auth error that looks like a
      # misconfigured Trusted Publisher rather than an old CLI.
      - name: Upgrade npm to a version that can use OIDC
        run: |
          npm install -g npm@^11.5.1
          npm --version

      - name: Install dependencies
        run: npm ci

      # The gem version, the npm version and the tag must agree. Two
      # independently versioned copies of the same client is the drift the
      # design note warns about, and a mismatch here is far cheaper to find
      # than a half-released pair of artefacts.
      - name: Check the tag matches both versions
        run: |
          npm_version=$(node -p "require('./package.json').version")
          gem_version=$(sed -n 's/.*VERSION *= *"\(.*\)".*/\1/p' lib/llm_meta_widget/version.rb)
          if [ "$npm_version" != "$gem_version" ]; then
            echo "::error::package.json $npm_version and version.rb $gem_version disagree — the gem and the npm package must ship the same version"
            exit 1
          fi
          # A manual dispatch has a branch ref, not a tag, so there is no tag to
          # compare against — the two versions agreeing is all that can be
          # checked. Dispatch is the recovery path for a release that failed
          # after tagging, and for verifying this workflow's OIDC auth.
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "dispatched from $GITHUB_REF_NAME (not a tag); versions agree at $npm_version"
            exit 0
          fi
          tag="${GITHUB_REF_NAME#v}"
          echo "tag=$tag npm=$npm_version gem=$gem_version"
          if [ "$tag" != "$npm_version" ]; then
            echo "::error::tag $tag does not match the version $npm_version in package.json and version.rb"
            exit 1
          fi

      # Fails if the committed bundle has drifted from its sources, so a
      # release can never ship a bundle the tag does not actually contain.
      # test:js rather than test, because there is no Ruby on this runner.
      - name: Verify the bundle and run the JS tests
        run: npm run test:js

      - name: Lint
        run: npm run lint

      # Guards the trap above: if anything has configured a registry credential,
      # npm would use it instead of OIDC and fail with a misleading 404. Better to
      # say so here than to decode that 404 again.
      - name: Assert no credential is configured, so OIDC is the only auth path
        run: |
          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::NODE_AUTH_TOKEN is set ($NODE_AUTH_TOKEN) — it will pre-empt OIDC"
            exit 1
          fi
          # Not `npm config get`: npm refuses to read _authToken back, calling it
          # a protected option, and the command's own failure then trips set -e.
          for f in "${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}" "$PWD/.npmrc"; do
            if [ -f "$f" ] && grep -q '_authToken' "$f"; then
              echo "::error::$f configures an authToken; it will pre-empt OIDC"
              exit 1
            fi
          done
          echo "no credential configured — OIDC is the only auth path"

      # No --provenance flag: trusted publishing attaches provenance
      # automatically. No token either — that is the point.
      - name: Publish
        run: npm publish
